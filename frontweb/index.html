<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>基金管理</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="app">
        <!-- Top Navbar -->
        <div class="navbar" id="navbar">
            <div class="nav-left" id="navLeft"></div>
            <span id="navTitle">基金管理</span>
            <div class="nav-right" id="navRight"></div>
        </div>

        <!-- Tab Pages -->
        <div class="page-container" id="pageContainer">
            <div id="page-index"></div>
            <div id="page-watchlist" class="hidden"></div>
            <div id="page-market" class="hidden"></div>
            <div id="page-mine" class="hidden"></div>
        </div>

        <!-- Sub Pages (slides in from right) -->
        <div class="sub-page" id="subPage">
            <div class="navbar" id="subNavbar">
                <div class="nav-left"><button class="nav-btn" id="subBackBtn">&larr; 返回</button></div>
                <span id="subNavTitle"></span>
                <div class="nav-right" id="subNavRight"></div>
            </div>
            <div id="subPageContent" style="overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;"></div>
        </div>

        <!-- Bottom Tab Bar -->
        <div class="tab-bar" id="tabBar">
            <div class="tab-item active" data-tab="index">
                <span class="tab-icon">&#128200;</span>
                <span>持有</span>
            </div>
            <div class="tab-item" data-tab="watchlist">
                <span class="tab-icon">&#11088;</span>
                <span>自选</span>
            </div>
            <div class="tab-item" data-tab="market">
                <span class="tab-icon">&#128202;</span>
                <span>行情</span>
            </div>
            <div class="tab-item" data-tab="mine">
                <span class="tab-icon">&#128100;</span>
                <span>我的</span>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox"></div>
    </div>

    <!-- Chart.js -->
    <script src="chart.js"></script>
    <!-- App Core -->
    <script src="app.js"></script>
    <!-- Pages -->
    <script src="pages/index.js"></script>
    <script src="pages/watchlist.js"></script>
    <script src="pages/market.js"></script>
    <script src="pages/mine.js"></script>
    <script src="pages/fund-detail.js"></script>
    <script src="pages/search.js"></script>
    <script src="pages/calendar.js"></script>
    <script src="pages/ranking.js"></script>
    <script src="pages/sector.js"></script>
    <script src="pages/sector-funds.js"></script>
    <script src="pages/funds.js"></script>
    <script src="pages/fund-manage.js"></script>
</body>
</html>
