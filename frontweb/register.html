<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>注册 - 基金管理</title>
    <link rel="stylesheet" href="app.css">
    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #722ed1, #b37feb);
            padding: 20px;
        }
        .register-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        .register-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .register-logo .logo-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .register-logo h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 6px;
        }
        .register-logo p {
            font-size: 14px;
            color: #999;
        }
        .register-card .form-input {
            height: 44px;
            border-radius: 8px;
            font-size: 15px;
        }
        .register-card .form-group {
            margin-bottom: 16px;
        }
        .register-btn {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 8px;
            background: #722ed1;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .register-btn:active { background: #5b21b6; }
        .register-btn:disabled { background: #b37feb; cursor: not-allowed; }
        .register-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .register-footer a { color: #722ed1; font-weight: 500; }
        .error-message {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .success-message {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .password-hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-card">
            <div class="register-logo">
                <div class="logo-icon">&#128200;</div>
                <h1>创建账户</h1>
                <p>开始您的基金管理之旅</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="username" name="username" class="form-input" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" class="form-input" placeholder="请输入邮箱（可选）">
                </div>
                <div class="form-group">
                    <input type="password" id="password" name="password" class="form-input" required placeholder="请输入密码">
                    <div class="password-hint">建议使用至少8位字符，包含字母和数字</div>
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required placeholder="请再次输入密码">
                </div>
                <button type="submit" id="registerButton" class="register-btn">注册</button>
            </form>

            <div class="register-footer">
                已有账户？<a href="login.html">立即登录</a>
            </div>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
