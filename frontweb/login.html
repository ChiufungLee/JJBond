<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - 基金管理</title>
    <link rel="stylesheet" href="app.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #722ed1, #b37feb);
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo .logo-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .login-logo h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 6px;
        }
        .login-logo p {
            font-size: 14px;
            color: #999;
        }
        .login-card .form-input {
            height: 44px;
            border-radius: 8px;
            font-size: 15px;
        }
        .login-card .form-group {
            margin-bottom: 16px;
        }
        .login-btn {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 8px;
            background: #722ed1;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .login-btn:active { background: #5b21b6; }
        .login-btn:disabled { background: #b37feb; cursor: not-allowed; }
        .remember-row {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-size: 14px;
            color: #666;
        }
        .remember-row input {
            margin-right: 8px;
            accent-color: #722ed1;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .login-footer a { color: #722ed1; font-weight: 500; }
        .error-message {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .success-message {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">&#128200;</div>
                <h1>基金管理</h1>
                <p>请登录您的账户</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="username" name="username" class="form-input" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <input type="password" id="password" name="password" class="form-input" required placeholder="请输入密码">
                </div>
                <div class="remember-row">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">记住登录状态</label>
                </div>
                <button type="submit" id="loginButton" class="login-btn">登录</button>
            </form>

            <div class="login-footer">
                还没有账户？<a href="register.html">立即注册</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
